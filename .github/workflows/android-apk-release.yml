name: Build & Upload KP TV Android APK (v2.9.0)

on:
  push:
    branches: [ main, master, audit-fix-complete ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Web Bundle & Android TV Debug APK (v2.9.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies & Build Production Bundle
        run: |
          npm install --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build

      - name: Sync Web Bundle into Android WebView Assets
        run: |
          rm -rf android/app/src/main/assets/www/*
          mkdir -p android/app/src/main/assets/www
          cp -r dist/index.html dist/assets dist/version.json dist/data android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable & Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Updated APK to releases/ and public/
        run: |
          mkdir -p releases public
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/kp-tv-launcher-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/kp-tv-launcher-debug.apk
          sha256sum public/kp-tv-launcher-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kp-tv-launcher-v2.9.0-debug-apk
          path: releases/kp-tv-launcher-debug.apk
          if-no-files-found: error

      - name: Publish Updated APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.9.0-latest' }}
          name: KP TV Smart TV Launcher v2.9.0 (${{ github.ref_name }})
          body: |
            ### KP TV – Smart TV Launcher v2.9.0 (Android TV / Google TV / Cloud TV OS)
            - **Package Name**: `com.kptv.launcher` (Version `2.9.0`, Build `9`)
            - **SDK Compatibility**: Android 5.0 (API 21) – Android 14 (API 34)
            - **What's New in v2.9.0**:
              1. **Automatic WebView Cache Invalidation (`LOAD_NO_CACHE` + `clearCache(true)`)**: Guarantees APK upgrades immediately display the latest launcher UI without stale WebView disk cache.
              2. **First-Time Default Home Launcher Prompt**: Prompts users on first launch to set KP TV as the device's default Home Launcher (`RoleManager.ROLE_HOME` on Android 10+ with `ACTION_HOME_SETTINGS` & `CATEGORY_HOME` chooser support, plus a D-pad friendly first-time setup prompt modal and Settings button).
              3. **App Default Icons Always Visible**: Added native `https://kptv.local/app-icon/<packageName>.png` PackageManager icon streaming, 96x96 PNG data-URI extraction, and automatic fallback badges so every app's default icon is always visible in both the Bottom Dock and App Drawer.
              4. **D-Pad Smooth Scroll & Pre-Focus Viewport Check (`AppDrawerModal`)**: Checks `getBoundingClientRect()` vs container dimensions and triggers smooth `scrollTo` before applying focus.
          files: |
            releases/kp-tv-launcher-debug.apk
