name: Build & Upload KP TV Android APK (v2.7.0)

on:
  push:
    branches: [ main, master, audit-fix-complete ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Web Bundle & Android TV Debug APK (v2.7.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies & Build Production Bundle
        run: |
          npm install --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build

      - name: Sync Web Bundle into Android WebView Assets
        run: |
          rm -rf android/app/src/main/assets/www/*
          mkdir -p android/app/src/main/assets/www
          cp -r dist/index.html dist/assets dist/version.json dist/data android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable & Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Updated APK to releases/ and public/
        run: |
          mkdir -p releases public
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/kp-tv-launcher-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/kp-tv-launcher-debug.apk
          sha256sum public/kp-tv-launcher-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kp-tv-launcher-v2.7.0-debug-apk
          path: releases/kp-tv-launcher-debug.apk
          if-no-files-found: error

      - name: Publish Updated APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.7.0-latest' }}
          name: KP TV Smart TV Launcher v2.7.0 (${{ github.ref_name }})
          body: |
            ### KP TV – Smart TV Launcher v2.7.0 (Android TV / Google TV / Cloud TV OS)
            - **Package Name**: `com.kptv.launcher` (Version `2.7.0`, Build `7`)
            - **SDK Compatibility**: Android 5.0 (API 21) – Android 14 (API 34)
            - **What's New in v2.7.0**:
              1. **D-Pad Smooth Scroll & Pre-Focus Viewport Check (`AppDrawerModal`)**: Checks `getBoundingClientRect()` vs container dimensions (`clientHeight`, `clientWidth`) and triggers `scrollTo({ behavior: 'smooth' })` before applying focus when an app card is partially hidden.
              2. **Direct Link Player Only (IPTV Removed)**: Streamlined home launcher card to open the Online Link Player (`M3U8 / MP4 / WebM / QR Link`) with Full Screen Play directly.
              3. **Direct Setopbox Source Switcher**: 1-tap inline `HDMI 1`, `HDMI 2`, and `AV` source buttons directly on the Setopbox home card for instant TV input switching.
              4. **Streamlined Launcher UI & Reduced Bundle Size**: Removed unnecessary texts, redundant buttons, and unused IPTV UI components.
          files: |
            releases/kp-tv-launcher-debug.apk
